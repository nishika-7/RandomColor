<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Colour Generator</title>
    <link rel = "stylesheet" href ="style.css">
</head>
<body>
    <div class = "container">
    <h3>Random Colour Generation</h3>
    <p>Discover new colors with a click</p>
    <div class = "main-colour colour-box" id = "main colour">
        <div class = "colour-code" id = "main colour code">#7E1946</div>
    </div>
    <div class = " colour-grid">
        <div class = "small-colour box" id ="right colour">
            <div class = "colour-code" id ="right colour code">#0C6291</div>
        </div> 
        <div class =  "small-colour box" id ="left colour">
            <div class = "colour-code" id ="left colour code">#1481BA</div>
        </div>
    </div>
    <div class = "btn-container">
        <button class = "btn" id ="newcoloursButton">New Colours</button>
    </div>
    </div>

    <script src  ="script.js"></script>
</body>
</html>
